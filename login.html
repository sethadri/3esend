<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — 3E Send</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { background: var(--gray-50); min-height: 100vh; display: flex; flex-direction: column; }
    .auth-page { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-left {
      background: var(--grad-hero);
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .auth-left .orb-1 { width: 350px; height: 350px; top: -80px; right: -80px; }
    .auth-left .orb-2 { width: 250px; height: 250px; bottom: -60px; left: 20px; opacity: .25; }
    .auth-brand { position: relative; z-index: 1; }
    .auth-brand .nav-logo { font-size: 2rem; margin-bottom: 40px; color: var(--white); display: block; }
    .auth-brand .nav-logo span { color: var(--teal); }
    .auth-tagline { color: var(--white); font-size: 2.2rem; font-weight: 800; font-family: var(--font-heading); line-height: 1.25; margin-bottom: 24px; }
    .auth-tagline em { font-style: normal; color: var(--teal); }
    .auth-tagline p { font-size: 1rem; font-weight: 400; color: rgba(255,255,255,.7); margin-top: 16px; }
    .auth-stats { display: flex; gap: 32px; position: relative; z-index: 1; }
    .auth-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 48px;
    }
    .auth-form-wrap { width: 100%; max-width: 420px; }
    .auth-form-wrap h2 { margin-bottom: 8px; }
    .auth-form-wrap > p { margin-bottom: 36px; font-size: .95rem; }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--gray-400); font-size: .85rem; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    .social-btn {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      background: var(--white);
      font-family: var(--font-body);
      font-size: .9rem;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all var(--dur) var(--ease);
      margin-bottom: 12px;
    }
    .social-btn:hover { border-color: var(--primary); background: var(--gray-50); }
    .form-footer { text-align: center; margin-top: 24px; font-size: .875rem; color: var(--gray-600); }
    .form-footer a { color: var(--primary); font-weight: 600; }
    .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    @media (max-width: 768px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-left { display: none; }
      .auth-right { padding: 40px 24px; padding-top: 100px; }
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-left">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="auth-brand">
        <a href="index.html" class="nav-logo">3E<span>Send</span></a>
        <div class="auth-tagline">
          Send money<br><em>the smart way.</em>
          <p>Fast, secure transfers to 25+ countries. Low fees, real-time tracking.</p>
        </div>
      </div>
      <div class="auth-stats">
        <div class="stat-chip"><span class="number">50K+</span><span class="label">Customers</span></div>
        <div class="stat-chip"><span class="number">25+</span><span class="label">Countries</span></div>
        <div class="stat-chip"><span class="number">4.9★</span><span class="label">Rating</span></div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrap">
        <h2>Welcome back</h2>
        <p>Log in to your 3E Send account</p>

        <button class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <button class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Continue with Facebook
        </button>

        <div class="auth-divider">or sign in with email</div>

        <form onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <div class="form-row">
              <label class="form-label" style="margin-bottom:0;">Password</label>
              <a href="#" style="font-size:.82rem;color:var(--primary);font-weight:600;">Forgot password?</a>
            </div>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:15px;">Log In →</button>
        </form>

        <div class="form-footer">
          Don't have an account? <a href="register.html">Sign up free</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
